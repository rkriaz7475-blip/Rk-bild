<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Football Card Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#07060a;--panel:#14110c;--line:#3a2f14;--gold:#e4b94a;--gold2:#8a6a1c;--text:#f3ead6;--mut:#a89c80;--ok:#7fd68a;--bad:#ff8a7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:500 16px/1.5 Barlow,system-ui,sans-serif;min-height:100vh;padding-bottom:76px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:800;line-height:1;margin:0}
h1{font-size:clamp(44px,12vw,88px)}h2{font-size:34px;margin-bottom:6px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{font:800 22px "Barlow Condensed",sans-serif;color:var(--gold)}
.pill{border:1px solid var(--gold2);color:var(--gold);padding:4px 12px;border-radius:99px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#0d0b07;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:1;text-align:center;color:var(--mut);text-decoration:none;font-size:12px;padding:8px 2px;border-radius:8px}
nav a.on{color:#1a1406;background:var(--gold);font-weight:600}
nav .full{display:none}
main{max-width:1000px;margin:0 auto;padding:22px 18px}
.note{border:1px dashed var(--gold2);color:var(--mut);padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:20px}
.hero{display:grid;gap:28px;align-items:center;padding:10px 0 30px}
.hero p{color:var(--mut);max-width:44ch}
.btn{background:linear-gradient(180deg,#f1ce72,#c99a2c);color:#1a1406;border:0;font:700 17px Barlow,sans-serif;padding:13px 22px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:disabled{background:#2a2418;color:#6d6246;cursor:not-allowed}
.btn.ghost{background:none;border:1px solid var(--gold2);color:var(--gold)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:16px}
.stage{perspective:900px;justify-self:center}
.card{--c1:#f1ce72;--c2:#7a5a14;width:200px;aspect-ratio:5/7;border-radius:16px;padding:3px;background:linear-gradient(145deg,var(--c1),var(--c2) 55%,var(--c1));box-shadow:0 14px 34px #000a;transition:transform .15s;transform-style:preserve-3d;position:relative}
.card .in{height:100%;border-radius:13px;background:radial-gradient(circle at 30% 18%,var(--bgA,#2b2412),#0b0905 72%);padding:12px;display:flex;flex-direction:column;overflow:hidden}
.card.sm{width:100%}
.ovr{font:800 40px "Barlow Condensed",sans-serif;color:var(--c1);line-height:.9}
.pos{font:600 13px Barlow;color:var(--mut)}
.ph{flex:1;margin:8px 0;border-radius:10px;background:#00000055 center/cover;display:grid;place-items:center;font:800 56px "Barlow Condensed";color:var(--c1);opacity:.95}
.nm{font:800 20px "Barlow Condensed";text-align:center;border-top:1px solid var(--c2);padding-top:6px}
.no{position:absolute;right:12px;top:12px;font:800 22px "Barlow Condensed";color:var(--c1)}
.d-classic{--bgA:#2b2412}.d-night{--bgA:#10163a}.d-pitch{--bgA:#0f2a17}.d-flame{--bgA:#3a1408}
.meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:8px;font-size:14px}
.price{color:var(--gold);font-weight:700}
.stat{font:800 60px "Barlow Condensed";color:var(--gold)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.form{display:grid;gap:14px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:5px;font-size:14px;color:var(--mut)}
input,select{background:#0b0905;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:11px;font:inherit;width:100%}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.bar{height:8px;background:#241e10;border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:var(--gold)}
.edit{display:grid;gap:22px}
.chat{display:grid;gap:12px;margin-top:10px}.log{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding:4px}.bub{max-width:80%;padding:9px 13px;border-radius:14px;background:#241e10;overflow-wrap:anywhere}.bub.me{align-self:flex-end;background:var(--gold);color:#1a1406}.bub small{display:block;font-size:11px;opacity:.7}.thr{display:grid;gap:2px;text-decoration:none;color:var(--text);margin-top:10px}#mf input{flex:1}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--gold);color:#1a1406;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
@media(min-width:760px){
 body{padding-bottom:0}.hero{grid-template-columns:1.2fr 1fr}.edit{grid-template-columns:1fr 260px}
 nav{position:static;border:0;background:none;padding:0;gap:4px}nav a{flex:none;font-size:15px;padding:8px 14px}
 nav .short{display:none}nav .full{display:inline}
 header{gap:16px}.card{width:240px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span class="logo">Football Card Arena</span><nav id="nav"></nav><span class="pill" id="wallet"></span></header>
<main id="app"></main>
<div id="toast"></div>
<script>
const PAGES=[["home","Home","Home"],["cards","Cards","Player Cards"],["store","Store","Card Store"],["coll","Collection","My Collection"],["claim","Claim","Daily Claim"],["msgs","Chat","Messages"],["me","Profile","My Profile"]];
const DESIGNS={classic:["#f1ce72","#7a5a14"],night:["#8fb4ff","#2a3f8f"],pitch:["#7fe0a0","#1f6a3a"],flame:["#ffb06a","#a33a10"]};
const MAX=26,CLAIM=10;
const S={bdt:100,coins:0,claimedOn:null,mine:null,owned:[],log:[],th:{}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
const names=["Kael Varrun","Ibo Sarnet","Dax Moreno","Lio Tamarin","Zane Okoro","Rafe Delmont","Niko Brandt","Ari Voss","Teo Halden","Sami Quill","Jory Penn","Milo Arden"];
const POS=["GK","CB","LB","RB","CDM","CM","CAM","LW","RW","ST"];
const STORE=names.map((n,i)=>({id:"S"+(1000+i),name:n,pos:POS[(i*3)%10],no:i+2,ovr:50+i%6,design:Object.keys(DESIGNS)[i%4],price:15+i*5,seller:i%3?"Player "+(300+i):"Arena Store"}));
const $=s=>document.querySelector(s);
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)};
/* Stage 1 persistence: state is saved in this browser (localStorage) until the Stage 2 database arrives. */
const LS_KEY="fca-arena-v1";
function save(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){try{const c=Object.assign({},S);if(c.mine){c.mine=Object.assign({},c.mine);delete c.mine.photo}localStorage.setItem(LS_KEY,JSON.stringify(c))}catch(e2){}}}
function load(){let d;try{d=JSON.parse(localStorage.getItem(LS_KEY))}catch(e){return}if(!d||typeof d!=="object")return;
 if(typeof d.bdt==="number"&&isFinite(d.bdt)&&d.bdt>=0)S.bdt=d.bdt;
 if(typeof d.coins==="number"&&isFinite(d.coins)&&d.coins>=0)S.coins=d.coins;
 if((typeof d.claimedOn==="number"&&Number.isInteger(d.claimedOn))||d.claimedOn===null)S.claimedOn=d.claimedOn;
 if(Array.isArray(d.owned))S.owned=d.owned.filter(o=>o&&typeof o==="object");
 if(Array.isArray(d.log))S.log=d.log.filter(x=>typeof x==="string");
 if(d.th&&typeof d.th==="object")S.th=d.th;
 if(d.mine&&typeof d.mine==="object"){const m=d.mine;S.mine={id:typeof m.id==="string"?m.id:"",name:typeof m.name==="string"?m.name.slice(0,24):"",pos:POS.includes(m.pos)?m.pos:"ST",no:(typeof m.no==="number"&&Number.isInteger(m.no)&&m.no>=1&&m.no<=99)?m.no:10,ovr:50,design:Object.keys(DESIGNS).includes(m.design)?m.design:"classic",color:/^#[0-9a-fA-F]{6}$/.test(m.color||"")?m.color:"#f1ce72",pub:m.pub!==false,photo:typeof m.photo==="string"?m.photo:null}}}
load();
const ini=n=>n.split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase();
function cardHTML(c,sm){const[d1,d2]=DESIGNS[c.design]||DESIGNS.classic;const col=c.color||d1;
 return `<div class="card ${sm?"sm":""} d-${c.design}" style="--c1:${col};--c2:${d2}"><div class="in"><div class="ovr">${c.ovr}</div><div class="pos">${c.pos}</div><div class="no">${c.no}</div><div class="ph" style="${c.photo?`background-image:url(${c.photo})`:""}">${c.photo?"":esc(ini(c.name||"?"))}</div><div class="nm">${esc(c.name)||"Your name"}</div></div></div>`}
function nav(){const h=(location.hash.slice(1)||"home").split("/")[0];$("#nav").innerHTML=PAGES.map(p=>`<a href="#${p[0]}" class="${h==p[0]?"on":""}"><span class="short">${p[1]}</span><span class="full">${p[2]}</span></a>`).join("");$("#wallet").textContent=`${S.bdt} BDT · ${S.coins} coins`;return h}
function dhakaDay(t){return Math.floor((t+6*36e5)/864e5)}
function nextReset(){return(dhakaDay(Date.now())+1)*864e5-6*36e5}
const V={
home:()=>`<div class="note">Stage 1 preview: your card, collection and coins are saved in this browser only. The database arrives in Stage 2. Demo balance is not real money.</div>
<section class="hero"><div><h1>Build your card. Trade the rest.</h1><p>Create one personal player card, earn coins every day in Bangladesh time, and collect up to 26 cards.</p><div class="row"><a class="btn" href="#me">Create my card</a><a class="btn ghost" href="#store">Open the store</a></div></div>
<div class="stage" id="stage">${cardHTML(S.mine||{name:"Arena Debut",pos:"ST",no:9,ovr:50,design:"classic"})}</div></section>`,
cards:()=>`<h2>Player Cards</h2><p class="pos">Public cards. Private cards never appear here.</p><div class="grid">${STORE.slice(0,8).map(c=>cardHTML(c,1)).join("")}${S.mine&&S.mine.pub?cardHTML(S.mine,1):""}</div>`,
store:()=>`<h2>Card Store</h2><p class="pos">${S.owned.length}/${MAX} in your collection</p><div class="grid">${STORE.map(c=>{const own=S.owned.some(o=>o.id==c.id),full=S.owned.length>=MAX;return `<div>${cardHTML(c,1)}<div class="meta"><span class="price">${c.price} BDT</span><span class="pos">${c.seller}</span></div><button class="btn" style="width:100%;margin-top:8px" data-buy="${c.id}" ${own||full||S.bdt<c.price?"disabled":""}>${own?"Owned":full?"Collection full":S.bdt<c.price?"Not enough balance":"Buy in demo mode"}</button>${c.seller=="Arena Store"?"":`<a class="btn ghost" style="width:100%;margin-top:8px;text-align:center" href="#msgs/${c.id}">Message seller</a>`}</div>`}).join("")}</div>`,
coll:()=>`<h2>My Collection</h2><div class="stat">${S.owned.length}/${MAX}</div><div class="bar"><i style="width:${S.owned.length/MAX*100}%"></i></div>${S.owned.length?`<div class="grid">${S.owned.map(c=>cardHTML(c,1)).join("")}</div>`:`<p class="pos">No cards yet. Buy your first card in the store.</p><a class="btn" href="#store">Go to the store</a>`}`,
claim:()=>{const done=S.claimedOn===dhakaDay(Date.now());return `<h2>Daily Claim</h2><div class="panel"><div class="stat">${S.coins} coins</div><p class="pos">Resets at midnight Bangladesh time. Next claim: ${done?new Date(nextReset()).toLocaleString("en-GB",{timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit",day:"numeric",month:"short"})+" (Dhaka)":"available now"}</p><button class="btn" id="claim" ${done?"disabled":""}>${done?"Claimed today":"Claim "+CLAIM+" coins"}</button></div><h3 style="margin:22px 0 8px">History</h3>${S.log.length?S.log.map(l=>`<div class="meta panel" style="margin-bottom:8px"><span>${l}</span><span class="price">+${CLAIM}</span></div>`).join(""):`<p class="pos">Your claims will appear here.</p>`}`},
msgs:()=>{const id=location.hash.split("/")[1];
 if(id){const c=STORE.find(x=>x.id==id);if(!c)return `<h2>Messages</h2><p class="pos">This listing no longer exists.</p>`;const t=S.th[id]||[];
 return `<a class="pos" href="#msgs">Back to messages</a><div class="chat"><div class="meta panel"><span><b>${esc(c.name)}</b> · ${c.price} BDT<br><span class="pos">Seller: ${c.seller}</span></span></div><div class="log" id="log">${t.length?t.map(m=>`<div class="bub me">${esc(m.t)}<small>${m.at}</small></div>`).join(""):`<p class="pos">Ask about this card. Keep the deal inside the Arena.</p>`}</div><form id="mf" class="row" style="flex-wrap:nowrap"><input id="mt" maxlength="300" placeholder="Write a message" autocomplete="off" required><button class="btn">Send</button></form></div>`}
 const ids=Object.keys(S.th);return `<h2>Messages</h2><div class="note">Preview: you can write to sellers, but replies need the database in Stage 2.</div>${ids.length?ids.map(i=>{const c=STORE.find(x=>x.id==i),l=S.th[i].slice(-1)[0];return `<a class="panel thr" href="#msgs/${i}"><b>${esc(c.name)}</b><span class="pos">You: ${esc(l.t)}</span></a>`}).join(""):`<p class="pos">No conversations yet. Open a card in the store and tap Message seller.</p><a class="btn" href="#store">Go to the store</a>`}`},
me:()=>{const m=S.mine||{name:"",pos:"ST",no:10,ovr:50,design:"classic",color:"#f1ce72",pub:true};return `<h2>My Profile</h2><p class="pos">${S.mine?"Edit your personal card. Rating cannot be changed by hand.":"You can create one personal card. Starting rating: 50."}</p><div class="edit"><form class="form panel" id="f">
<label>Photograph<input type="file" id="ph" accept="image/jpeg,image/png,image/webp"></label>
<label>Player name<input id="nm" maxlength="24" value="${esc(m.name)}" required></label>
<div class="two"><label>Position<select id="ps">${POS.map(p=>`<option ${p==m.pos?"selected":""}>${p}</option>`).join("")}</select></label><label>Jersey number<input id="no" type="number" min="1" max="99" value="${m.no}"></label></div>
<div class="two"><label>Card design<select id="ds">${Object.keys(DESIGNS).map(d=>`<option ${d==m.design?"selected":""}>${d}</option>`).join("")}</select></label><label>Card color<input id="cl" type="color" value="${m.color||"#f1ce72"}"></label></div>
<label>Visibility<select id="vs"><option value="1" ${m.pub?"selected":""}>Public: appears in gallery and search</option><option value="0" ${m.pub?"":"selected"}>Private: only you can see it</option></select></label>
<button class="btn">${S.mine?"Save changes":"Create my card"}</button></form><div class="stage"><div id="pv"></div></div></div>`}
};
function render(){const h=nav();$("#app").innerHTML=(V[h]||V.home)();bind(h);save()}
function bind(h){
 if(h=="home"){const st=$("#stage"),c=st.firstElementChild;st.onpointermove=e=>{const r=st.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`rotateY(${x*28}deg) rotateX(${-y*28}deg)`};st.onpointerleave=()=>c.style.transform=""}
 if(h=="store")document.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const c=STORE.find(x=>x.id==b.dataset.buy);if(S.owned.length>=MAX||S.bdt<c.price||S.owned.some(o=>o.id==c.id))return;S.bdt-=c.price;S.owned.push(c);toast("Added to your collection");render()});
 if(h=="claim"&&$("#claim"))$("#claim").onclick=()=>{if(S.claimedOn===dhakaDay(Date.now()))return;S.claimedOn=dhakaDay(Date.now());S.coins+=CLAIM;S.log.unshift(new Date().toLocaleDateString("en-GB",{timeZone:"Asia/Dhaka",day:"numeric",month:"short",year:"numeric"}));toast(CLAIM+" coins claimed");render()};
 if(h=="msgs"&&$("#mf")){const id=location.hash.split("/")[1],lg=$("#log");lg.scrollTop=lg.scrollHeight;$("#mf").onsubmit=e=>{e.preventDefault();const v=$("#mt").value.trim();if(!v)return;(S.th[id]=S.th[id]||[]).push({t:v,at:new Date().toLocaleTimeString("en-GB",{timeZone:"Asia/Dhaka",hour:"2-digit",minute:"2-digit"})});render();const l=$("#log");l.scrollTop=l.scrollHeight;$("#mt").focus()}}
 if(h=="me"){let photo=S.mine&&S.mine.photo||null;const cur=()=>({id:S.mine?S.mine.id:"C-"+Math.random().toString(36).slice(2,8).toUpperCase(),name:$("#nm").value.trim(),pos:$("#ps").value,no:$("#no").value||0,ovr:50,design:$("#ds").value,color:$("#cl").value,pub:$("#vs").value=="1",photo});
  const pv=()=>$("#pv").innerHTML=cardHTML(cur());pv();
  document.querySelectorAll("#f input,#f select").forEach(e=>e.oninput=pv);
  $("#ph").onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>3e6){toast("Use a JPG, PNG or WebP under 3 MB");e.target.value="";return}const r=new FileReader();r.onload=()=>{photo=r.result;pv()};r.readAsDataURL(f)};
  $("#f").onsubmit=e=>{e.preventDefault();const c=cur();if(!c.name){toast("Enter a player name");return}const no=Number(c.no);if(!Number.isInteger(no)||no<1||no>99){toast("Jersey number must be 1–99");return}c.no=no;const had=!!S.mine;S.mine=c;toast(had?"Card saved":"Card created");render()}}
}
addEventListener("hashchange",render);render();
</script>
</body>
</html>
